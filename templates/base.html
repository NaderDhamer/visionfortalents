{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Vision for Talents{% endblock %}</title>
  <meta name="description" content="Vision for Talents — EU-funded research and training project by Institut Pasteur de Tunis.">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --vft-home-navbar-bg: #447690;
      --vft-footer-bg: #262424;
      --vft-link-color: #8E8E8E;
      --vft-link-hover: #D35840;
      --font-family-base: 'Inter', sans-serif;
    }

    html, body {
      font-family: var(--font-family-base);
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
    }

    main {
      flex: 1 0 auto;
    }

    /* Home page navbar: colored background, white text */
    .navbar-home {
      background-color: var(--vft-home-navbar-bg) !important;
    }
    .navbar-home .navbar-brand,
    .navbar-home .nav-link {
      color: #fff !important;
    }
    .navbar-home .nav-link:hover,
    .navbar-home .nav-link:focus {
      color: var(--vft-link-hover) !important;
    }

    /* All other pages: white navbar, gray text, coral hover */
    .navbar-page {
      background-color: #fff !important;
      border-bottom: 1px solid #eee;
    }
    .navbar-page .navbar-brand,
    .navbar-page .nav-link {
      color: var(--vft-link-color) !important;
    }
    .navbar-page .nav-link:hover,
    .navbar-page .nav-link:focus {
      color: var(--vft-link-hover) !important;
    }

    #wpCarousel {
      position: relative;
      overflow: hidden;
    }

    /* Parallax carousel background */
    .carousel-item img {
      animation: parallax-scroll 0.5s ease-out;
    }

    @keyframes parallax-scroll {
      from {
        transform: translateY(-20px);
      }
      to {
        transform: translateY(0);
      }
    }

    /* Subtle carousel caption fade */
    .carousel-caption {
      animation: fadeIn 0.8s ease-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    /* Fade-in on scroll */
    .fade-in {
      opacity: 0;
      animation: fadeInUp 0.8s ease-out forwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Stagger animation for cards */
    .fade-in.delay-1 { animation-delay: 0.1s; }
    .fade-in.delay-2 { animation-delay: 0.2s; }
    .fade-in.delay-3 { animation-delay: 0.3s; }

    /* Card hover lift effect */
    .card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15) !important;
    }

    .site-footer {
      background-color: var(--vft-footer-bg) !important;
      flex-shrink: 0;
      margin-top: 5rem;
    }

    /* Reusable accent button */
    .btn-accent {
      background-color: var(--vft-link-hover);
      color: #fff;
      border: none;
      transition: background-color 0.3s ease;
    }

    .btn-accent:hover {
      background-color: #b8452f;
      color: #fff;
      transform: translateY(-2px);
    }

    /* Horizontal scroll container */
    .scroll-container {
      display: flex;
      overflow-x: auto;
      gap: 1.5rem;
      padding: 1rem 0;
      scroll-behavior: smooth;
    }

    .scroll-container::-webkit-scrollbar {
      height: 8px;
    }

    .scroll-container::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }

    .scroll-container::-webkit-scrollbar-thumb {
      background: var(--vft-link-hover);
      border-radius: 10px;
    }

    .scroll-container::-webkit-scrollbar-thumb:hover {
      background: #b8452f;
    }

    .scroll-card {
      flex: 0 0 calc(33.333% - 1rem);
      min-width: 300px;
    }

    @media (max-width: 768px) {
      .scroll-card {
        flex: 0 0 calc(100% - 1rem);
        min-width: 280px;
      }
    }

   .site-footer {
  background-color: var(--vft-footer-bg) !important;
  flex-shrink: 0;
  margin-top: 5rem;
  color: #fff;
}

.footer-logo-placeholder {
  display: inline-block;
}

.footer-logo {
  filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
  transition: transform 0.3s ease;
}

.footer-logo:hover {
  transform: scale(1.05);
}

.footer-nav {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.footer-nav a {
  color: #fff;
  text-decoration: none;
  font-size: 0.95rem;
  transition: color 0.3s ease, padding-left 0.3s ease;
  padding-left: 0;
}

.footer-nav a:hover {
  color: var(--vft-link-hover);
  padding-left: 8px;
}

.footer-nav .dropdown-menu-dark {
  background-color: rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.1);
  min-width: 180px;
  right: 0 !important;
  left: auto !important;
}

.footer-nav .dropdown-item {
  color: #fff;
  transition: background-color 0.3s ease;
  font-size: 0.9rem;
}

.footer-nav .dropdown-item:hover {
  background-color: var(--vft-link-hover);
  color: #fff;
}

.footer-nav .dropdown-toggle::after {
  display: none;
}

.site-footer a {
  transition: color 0.3s ease;
}

.site-footer a:hover {
  color: var(--vft-link-hover);
}
.bg-light {
  background-color: #f8f9fa;
}

.latest-section .card {
  border: none;
  transition: all 0.3s ease;
}

.latest-section .card:hover {
  transform: translateY(-5px);
  box-shadow: 0 12px 24px rgba(0, 0, 0, 0.1) !important;
}

.latest-section .card img {
  object-fit: cover;
}
  </style>
</head>
<body>

  {% include 'includes/header.html' %}

  <main>
    {% block content %}{% endblock %}
  </main>

  {% include 'includes/footer.html' %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Fade-in animation on scroll
    const observerOptions = {
      threshold: 0.1,
      rootMargin: '0px 0px -100px 0px'
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('fade-in');
          observer.unobserve(entry.target);
        }
      });
    }, observerOptions);

    document.querySelectorAll('[data-animate]').forEach(el => {
      observer.observe(el);
    });
  </script>
</body>
</html>
